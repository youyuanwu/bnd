[package]
name = "bnd-bindgen"
version = "0.0.7"
edition.workspace = true
rust-version = "1.95"
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Generates Rust bindings from WinMD metadata"
repository.workspace = true
documentation = "https://docs.rs/bnd-bindgen"
readme = "README.md"
keywords = ["winmd", "ffi", "bindings", "codegen", "rust"]
categories = ["development-tools::ffi", "external-ffi-bindings"]
include = [
    "README.md",
    "VENDORED.md",
    "vendored/windows-bindgen/Cargo.toml.upstream",
    "vendored/windows-bindgen/license-apache-2.0",
    "vendored/windows-bindgen/license-mit",
    "vendored/windows-bindgen/readme.md",
    "vendored/windows-bindgen/src/**",
    "tests/*.rs",
]

[lib]
name = "windows_bindgen"
path = "vendored/windows-bindgen/src/lib.rs"

[dependencies]
windows-default = { version = "0.100", default-features = false }
windows-metadata = { version = "0.100", default-features = false }
proc-macro2 = { version = "1", default-features = false }
quote = { version = "1", default-features = false }

[dev-dependencies]
windows-link = { version = "0.100", default-features = false }

[package.metadata.docs.rs]
targets = []
