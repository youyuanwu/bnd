[workspace]
resolver = "2"
members = ["bnd-bindgen", "bnd-clang", "bnd-macros", "bnd-openssl", "bnd-openssl-gen", "bnd-linux", "bnd-linux-gen", "tests/simple-impl", "tests/e2e-clang-multi", "tests/e2e-clang-simple", "tests/e2e-clang-zlib", "tests/bnd-linux-tests"]

package.edition = "2024"
package.authors = [ "youyuanwu@outlook.com" ]
package.documentation = "https://github.com/youyuanwu/bnd"
package.repository = "https://github.com/youyuanwu/bnd"
package.license = "MIT"

[workspace.dependencies]
simple-impl = { path = "tests/simple-impl" }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-metadata = "0.100"

# Crate in this repo.
bnd-macros = { path = "bnd-macros", version = "0.0.6" }