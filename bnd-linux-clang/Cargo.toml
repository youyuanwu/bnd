[package]
name = "bnd-linux-clang"
version = "0.0.0"
edition.workspace = true
description = "Staging crate for bnd-linux bindings generated through bnd-clang"
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
bnd-macros.workspace = true

[dev-dependencies]
libc = "0.2"
tempfile.workspace = true

[features]
default = [
    "__sigset_t",
    "epoll",
    "eventfd",
    "sendfile",
    "struct_timespec",
    "types",
]
Foundation = []
# generated features
__sigset_t = ["Foundation"]
epoll = ["Foundation", "__sigset_t", "struct_timespec", "types"]
eventfd = ["Foundation"]
sendfile = ["Foundation", "types"]
struct_timespec = ["Foundation", "types"]
types = ["Foundation"]
