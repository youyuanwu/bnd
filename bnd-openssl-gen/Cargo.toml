[package]
name = "bnd-openssl-gen"
version = "0.1.0"
edition.workspace = true
description = "Generator that produces the bnd-openssl crate from OpenSSL system headers"
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
bnd-clang = { path = "../bnd-clang" }
staged-bindgen = { package = "bnd-bindgen", path = "../bnd-bindgen" }
tempfile.workspace = true
tracing-subscriber.workspace = true
windows-metadata.workspace = true
windows-rdl = { version = "0.100", default-features = false }
